# Backend on Render (free web service). NOT tested from this sandbox.
# SQLite on Render's free disk is wiped on each redeploy/restart: the demo data is re-seeded on every start.
services:
  - type: web
    name: landshield-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free           # without this line Render defaults to Starter ($7/month)
    healthCheckPath: /api/v1/health
    envVars:
      - key: ML_SCORING
        value: "off"        # scikit-learn is too heavy for the free 512 MB instance; rules still run
      - key: APP_ENV
        value: prod
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: DATABASE_URL
        value: sqlite:///./landshield.db   # D6 (docs/deploy-render.md): replace with the managed Postgres URL in the dashboard
      - key: STORAGE_PATH
        value: ./storage
      # D6 persistent files: set STORAGE_BACKEND=s3 + the S3_* values in the dashboard (docs/deploy-render.md).
      # SEED_MODE defaults to auto: SQLite is re-seeded on every boot, a Postgres database only when empty.
      - key: JWT_SECRET
        generateValue: true
      - key: HASH_SALT
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false          # you type it in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # https://<your-site>.netlify.app (no trailing slash)
      - key: PUBLIC_SITE_URL
        sync: false          # https://<your-site>.netlify.app: the origin the PDF's QR code points to (no trailing slash)
      - key: SIGNING_KEY
        sync: false          # Ed25519 seed (base64url, 32 bytes); without it the disk-less instance signs with a new key on every restart
# Start command (Dockerfile CMD): alembic upgrade head + seed --mode $SEED_MODE (auto: reset on SQLite, only-if-empty on Postgres) on every boot.
