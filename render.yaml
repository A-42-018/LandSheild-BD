# Backend on Render (free web service).
# Without D6 (docs/deploy-render.md) the database is SQLite on Render's free disk, which is wiped on each
# redeploy/restart: the demo data is re-seeded on every start and uploads are lost.
services:
  - type: web
    name: landshield-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free           # without this line Render defaults to Starter ($7/month)
    healthCheckPath: /api/v1/health
    envVars:
      - key: ML_SCORING
        value: "off"        # scikit-learn is too heavy for the free 512 MB instance; rules still run
      - key: APP_ENV
        value: prod
      - key: MOUZA_ENABLED_DIVISION_ID
        value: "3"          # synthetic demo mouza/JL/sheet registry (database/gis/mouzas.json), Dhaka division
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      # D6 (docs/deploy-render.md §2-3): set in the dashboard, never here. A `value:` in this file would be
      # written back on every Blueprint sync and silently switch production back to the wiped SQLite disk.
      # Left empty, DATABASE_URL falls back to the image's SQLite and STORAGE_BACKEND to local.
      - key: DATABASE_URL
        sync: false          # postgresql://...?sslmode=require (Neon / Supabase)
      - key: STORAGE_PATH
        value: ./storage
      - key: STORAGE_BACKEND
        sync: false          # s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # SEED_MODE defaults to auto: SQLite is re-seeded on every boot, a Postgres database only when empty.
      - key: ANTHROPIC_API_KEY
        sync: false          # optional (D3); empty = rules only. Gateway: also ANTHROPIC_BASE_URL + ANTHROPIC_AUTH
      - key: CLAUDE_DAILY_CAP
        value: "100"         # max Claude calls per day; over the cap the rules read alone
      - key: JWT_SECRET
        generateValue: true
      - key: HASH_SALT
        generateValue: true
      - key: DEMO_PASSWORD
        sync: false          # you type it in the Render dashboard
      - key: CORS_ORIGINS
        sync: false          # https://<your-site>.netlify.app (no trailing slash)
      - key: PUBLIC_SITE_URL
        sync: false          # https://<your-site>.netlify.app: the origin the PDF's QR code points to (no trailing slash)
      - key: SIGNING_KEY
        sync: false          # Ed25519 seed (base64url, 32 bytes); without it the disk-less instance signs with a new key on every restart
# Start command (Dockerfile CMD): alembic upgrade head + seed --mode $SEED_MODE (auto: reset on SQLite, only-if-empty on Postgres) on every boot.
