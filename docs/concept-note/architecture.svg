<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" font-family="Inter, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker>
    <style>
      .box{fill:#fff;stroke:#006a4e;stroke-width:1.5}
      .alt{fill:#f1f5f2;stroke:#94a3b8;stroke-width:1.2}
      .t{font-weight:700;fill:#0f172a}
      .s{fill:#475569;font-size:10.5px}
      .l{stroke:#475569;stroke-width:1.3;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <!-- users -->
  <rect class="alt" x="8" y="20" width="128" height="190" rx="4"/>
  <text class="t" x="20" y="42">Users</text>
  <text class="s" x="20" y="64">Citizen / buyer</text>
  <text class="s" x="20" y="84">Reviewer</text>
  <text class="s" x="20" y="104">Officer (AC Land)</text>
  <text class="s" x="20" y="124">Admin</text>
  <text class="s" x="20" y="144">QR scanner</text>
  <text class="s" x="20" y="186">EN + বাংলা</text>
  <!-- frontend -->
  <rect class="box" x="170" y="20" width="150" height="190" rx="4"/>
  <text class="t" x="182" y="42">Next.js web</text>
  <text class="s" x="182" y="64">Verify · Check before</text>
  <text class="s" x="182" y="78">you buy · Verify a copy</text>
  <text class="s" x="182" y="98">Upload · Review queue</text>
  <text class="s" x="182" y="118">e-Mutation queue</text>
  <text class="s" x="182" y="138">Map · Graph · Report</text>
  <text class="s" x="182" y="158">Public QR page</text>
  <text class="s" x="182" y="196">Netlify</text>
  <!-- api -->
  <rect class="box" x="356" y="20" width="200" height="190" rx="4"/>
  <text class="t" x="368" y="42">FastAPI  /api/v1</text>
  <text class="s" x="368" y="62">JWT + RBAC · rate limit · audit</text>
  <rect class="alt" x="366" y="72" width="180" height="26" rx="3"/>
  <text class="s" x="374" y="89">Posting: hash + Ed25519 sign</text>
  <rect class="alt" x="366" y="104" width="180" height="26" rx="3"/>
  <text class="s" x="374" y="121">Risk engine: 14 rules + ML hint</text>
  <rect class="alt" x="366" y="136" width="180" height="26" rx="3"/>
  <text class="s" x="374" y="153">e-Mutation: pre-checks, states</text>
  <rect class="alt" x="366" y="168" width="180" height="26" rx="3"/>
  <text class="s" x="374" y="185">Pre-purchase · doc-verify</text>
  <!-- ai -->
  <rect class="box" x="592" y="20" width="220" height="80" rx="4"/>
  <text class="t" x="604" y="42">ai/ package</text>
  <text class="s" x="604" y="62">OpenCV preprocess → Tesseract</text>
  <text class="s" x="604" y="76">ben+eng → field extractor</text>
  <text class="s" x="604" y="90">(confidence) · Isolation Forest</text>
  <!-- db -->
  <rect class="box" x="592" y="120" width="220" height="90" rx="4"/>
  <text class="t" x="604" y="142">Database (SQLite → PostGIS)</text>
  <text class="s" x="604" y="162">lands · deeds · transactions</text>
  <text class="s" x="604" y="176">ownership · mutation_records</text>
  <text class="s" x="604" y="190">land_encumbrances · ledger_entries</text>
  <text class="s" x="604" y="204">(hash-chained) · audit_logs</text>
  <!-- arrows -->
  <path class="l" d="M136,115 L168,115"/>
  <path class="l" d="M320,115 L354,115"/>
  <path class="l" d="M556,60 L590,60"/>
  <path class="l" d="M556,165 L590,165"/>
</svg>
